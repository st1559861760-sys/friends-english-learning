<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>老友记英语学习台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <h1 id="page-title">学习台</h1>
      <p id="page-subtitle" class="subtitle"></p>
    </header>

    <!-- Main content area -->
    <main id="main-content" class="main-content">
      <!-- Pages will be rendered here -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-page="home">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>首页</span>
      </button>
      <button class="nav-item" data-page="episodes">
        <svg viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        <span>剧集</span>
      </button>
      <button class="nav-item" data-page="review">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span>复习</span>
      </button>
    </nav>

    <!-- Floating note / ask button -->
    <button id="note-fab" class="note-fab" onclick="toggleNotePanel()" title="笔记 / 问问">?</button>

    <!-- Note / ask panel -->
    <div id="note-panel" class="note-panel hidden">
      <div class="note-panel-header">
        <div class="note-panel-tabs">
          <button class="note-tab active" data-tab="notes" onclick="setNoteTab('notes')">注意力集中敲重点啦！</button>
          <button class="note-tab" data-tab="ask" onclick="setNoteTab('ask')">记录下你的疑问吧～</button>
        </div>
        <button class="icon-btn" onclick="toggleNotePanel()" aria-label="关闭">×</button>
      </div>
      <div class="note-panel-body" id="note-panel-body"></div>
    </div>
  </div>

  <script src="content.js"></script>
  <script src="transcripts.js"></script>
  <script src="app.js"></script>
</body>
</html>
